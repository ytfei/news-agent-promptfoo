# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 半程观测录｜公众号提示词迭代评测 v0-v4

# config:
#   maxConcurrency: 2
#   retry: true
#   outputPath: "./eval_bancheng_result.html"
#   # 如需Langfuse追踪，取消下面注释填入密钥
#   # langfuse:
#   #   publicKey: pk-xxx
#   #   secretKey: sk-xxx
#   #   baseUrl: https://cloud.langfuse.com

prompts:
  - label: "v0 基线版"
    id: file://prompts/gzh_writer_v0.md

  - label: "v1 增加负向禁止清单"
    id: file://prompts/gzh_writer_v1.md

  - label: "v2 句式叙事强制约束"
    id: file://prompts/gzh_writer_v2.md

  # - label: "v3 Few-shot注入个人样本"
  #   id: file://prompts/gzh_writer_v3.md

providers:
  - id: deepseek:deepseek-v4-flash
    config:
      temperature: 0.2
      max_tokens: 120000
      top_p: 0.2
      showThinking: false

# 全局默认评估规则，所有测试用例自动继承
defaultTest:
  options:
      provider:
        id: deepseek:deepseek-v4-flash
        config:
          showThinking: false
  # assert:
  #   # 硬规则：黑名单词检测，确定性校验，稳定不随机
  #   # - type: not-contains
  #   #   value:
  #   #     - 综上所述
  #   #     - 一言以蔽之
  #   #     - 由此可见
  #   #     - 在这个飞速发展的时代
  #   #     - 大模型浪潮来临
  #   #     - 重磅
  #   #     - 干货
  #   #     - 引爆
  #   #     - 必看
  #   #     - 点赞
  #   #     - 在看
  #   #     - 转发
  #   #     - 收藏
  #   # LLM裁判：5维度文风打分（核心评估方案）
  #   - type: llm-rubric
  #     # provider: deepseek:deepseek-v4-flash
  #     threshold: 8
  #     value: |
  #       你是专业文风裁判，对下面的公众号文章输出进行打分，满分10分。
  #       评分规则：
  #       维度1【人设视角，0-2分】：是否为40岁技术创业者第一人称观测视角；有无“我观测/我踩坑”这类思考感。
  #         2分：稳定第一人称，是亲历落地思考；
  #         1分：第一人称弱，偏向客观教科书；
  #         0分：完全第三人称科普。
  #       维度2【营销词与绝对化表述，0-2分】：检查是否出现营销号夸张词汇、绝对化断言（一定、必然、100%）
  #         2分：无营销词，观点带有前提、保留不确定性；
  #         1分：少量绝对化表述，无营销词；
  #         0分：大量营销词/绝对化结论。
  #       维度3【句式段落，0-2分】：短句为主，段落短小，适配公众号手机阅读。
  #         2分：短句，2-3句话一段，无超长段落；
  #         1分：部分长句，段落偏大；
  #         0分：大段密集文字，大量长难句。
  #       维度4【表达风格，0-2分】：通俗类比，理性克制，无鸡汤、无华丽排比。
  #         2分：善用类比，理性克制，没有抒情鸡汤；
  #         1分：少量修饰，无鸡汤；
  #         0分：大量排比、宏大叙事、鸡汤。
  #       维度5【合规边界，0-2分】：没有投资建议，只拆解底层逻辑。
  #         2分：仅做逻辑科普，无任何荐股、买卖建议；
  #         1分：边界模糊，但没有直接投资建议；
  #         0分：出现明确投资操作建议。

  #       严格按下面格式输出，不要额外多余文字：
  #       总分：X/10
  #       分项得分：维度1:X,维度2:X,维度3:X,维度4:X,维度5:X
  #       问题清单：逐条列出文风缺陷。

tests:
  - description: "正文｜AI Agent在金融投研落地痛点（400字）"
    vars:
      news: ""

  - description: "开篇｜大模型幻觉对投研的致命影响（150字）"
    vars:
      user_input: >
        任务：写公众号开篇150字，主题《大模型幻觉对投研的致命影响》。
        要求：不用概念直接开场，从真实工程观测场景切入，自然引出主题，不要烂大街套话。

  - description: "结尾｜大模型幻觉延伸思考（120字）"
    vars:
      user_input: >
        任务：写公众号结尾120字，主题《大模型幻觉对投研的致命影响》。
        要求：不要复述全文总结，写延伸思考，开放式问题引导评论，带上风险免责，不要求点赞在看。
